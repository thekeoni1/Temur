[package]
name = "temur"
version = "0.34.0"
edition = "2021"
description = "Zero-runtime-dependency single static binary AI agent for any Linux, down to 32-bit and embedded. Bring your own model: hosted or fully offline against local models"
license = "MIT"

[dependencies]
lexopt = "0.3"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
# preserve_order: `/model --save` re-serializes the user's config
# file, and their key order must survive the round trip. Pulls in indexmap,
# pure Rust; the forbidden-deps gate below stays authoritative.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Pure-Rust TLS stack, deliberately: rustls with the *ring* crypto provider
# (aws-lc-rs needs cmake/C and is riskier on i686) and ureq's bundled
# webpki-roots (the i386/debian runtime image ships no ca-certificates).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Root store for doctor's raw TLS-handshake probe. Already in the
# tree transitively via ureq's rustls-webpki-roots feature; this direct
# line adds no new code, it only makes the roots nameable.
webpki-roots = "1"
# Tool implementations (ripgrep's pure-Rust building blocks + process timeout)
regex = "1"
globset = "0.4"
ignore = "0.4"
wait-timeout = "0.2"
# TUI: pure-Rust stack, ratatui + its re-exported crossterm
# (no direct crossterm pin, avoiding version skew). No C build, no cmake,
# no crypto; the forbidden-dep scan in check.sh keeps enforcing that.
ratatui = "0.29"
unicode-width = "0.2" # already in ratatui's tree; used directly for wrapping
# Plain-REPL SIGINT (v0.1.1): sigaction without SA_RESTART. FFI-only,
# already in the tree transitively via ring; musl-safe on every target.
libc = "0.2"
# TUI markdown rendering: pure-Rust CommonMark pull parser; we
# write the terminal renderer ourselves. No default features (no html
# writer, no getopts); options enabled in code: strikethrough only.
# Adds only unicase beyond crates already in the tree (bitflags, memchr).
pulldown-cmark = { version = "0.13.4", default-features = false }

# T54 (D20): documents the read tool can open, all pure Rust, all
# permissive. calamine reads xlsx/xlsm/xls/ods and yields CACHED values, so
# temur never evaluates a formula. pdf-extract (which pulls lopdf) turns a
# PDF content stream into text and exposes output_doc_page, so a long PDF is
# paged rather than extracted whole. zip + quick-xml walk docx by hand:
# word/document.xml is simple enough that a docx crate would be more
# dependency than parser. quick-xml is pinned to 0.41 to match calamine's
# own pin; a second major version in the tree costs 21,376 bytes of binary
# for nothing (measured, T54 P0 trim pass).
calamine = { version = "0.36", default-features = false }
# T54 P2/P3 (D23): writing xlsx, including charts. Shares zip and the
# deflate stack with calamine, so it adds nine crates rather than a
# parallel toolchain.
rust_xlsxwriter = { version = "0.99", default-features = false }
pdf-extract = { version = "0.12", default-features = false }
# T60: writing PDFs rides the lopdf already under pdf-extract; this line
# makes it a direct dependency and adds no crate and no code.
lopdf = { version = "0.42", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
