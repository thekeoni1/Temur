# Build output goes to native ext4, never a drvfs mount (a target/ dir there
# is slow and thrashes any cloud-sync client watching it).
# Default target is the fast inner loop; the shipped artifact is the
# i686-unknown-linux-musl static release (scripts/check.sh gates both).
[build]
target-dir = "/home/dev/rustcode-target"
target = "i686-unknown-linux-gnu"

# musl-static release (the shipped artifact): link with rust-lld (ships with
# rustup) against the toolchain's self-contained musl libc; host gcc
# (multilib) compiles ring's C/asm. No musl-gcc / musl-tools package needed.
[target.i686-unknown-linux-musl]
linker = "rust-lld"

# T7 multi-arch: same recipe generalized — rust-lld against each rustup
# target's self-contained musl; host or cross gcc compiles ring's C/asm.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

[env]
CC_i686_unknown_linux_musl = "gcc"
CC_x86_64_unknown_linux_musl = "gcc"
# Ubuntu cross-gcc compiles ring's C against glibc headers; the objects are
# freestanding enough for musl linking, but fortify/stack-protector would
# inject glibc-only __*_chk symbols — the CFLAGS switch both off.
CC_aarch64_unknown_linux_musl = "aarch64-linux-gnu-gcc"
CFLAGS_aarch64_unknown_linux_musl = "-U_FORTIFY_SOURCE -fno-stack-protector"
CC_armv7_unknown_linux_musleabihf = "arm-linux-gnueabihf-gcc"
CFLAGS_armv7_unknown_linux_musleabihf = "-U_FORTIFY_SOURCE -fno-stack-protector"
